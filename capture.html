<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2B Capture</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2B Capture">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #00c896;
    --accent-press: #00a87e;
    --text: #e8e8e8;
    --text-dim: #666;
    --text-mid: #999;
    --journal: #e57a44;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    min-height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 2px 10px;
  }
  .brand { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: -0.5px; }
  .links { display: flex; gap: 14px; }
  .links a { color: var(--text-dim); font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-decoration: none; }
  .links a:active { color: var(--accent); }

  /* Compose box */
  .compose {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    line-height: 1.5;
    resize: none;
    outline: none;
    width: 100%;
    min-height: 120px;
  }
  textarea::placeholder { color: var(--text-dim); }

  #topic {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border-radius: 9px;
    padding: 8px 11px;
    outline: none;
    width: 100%;
  }
  #topic::placeholder { color: var(--text-dim); }
  #topic:focus { border-color: var(--accent); }

  /* Photo thumbnails */
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumbs:empty { display: none; }
  .thumb {
    position: relative;
    width: 64px; height: 64px;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 2px; right: 2px;
    width: 20px; height: 20px;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.65); color: #fff;
    font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Action bar */
  .actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text-mid);
    width: 46px; height: 46px;
    font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--surface); }
  .spacer { flex: 1; }
  #save {
    background: var(--accent);
    border: none;
    border-radius: 11px;
    color: #04130f;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 15px;
    padding: 0 22px;
    height: 46px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  #save:active { background: var(--accent-press); }
  #save:disabled { opacity: 0.5; }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
    margin: 10px 0 4px;
  }
  .status {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    min-height: 16px;
    margin: 8px 0;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: #f87171; }
  .status.queued { color: var(--journal); }

  /* Recent */
  .recent-head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 4px 8px;
  }
  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--journal);
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 8px;
  }
  .entry .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-dim); margin-bottom: 5px; display: flex; gap: 8px; }
  .entry .meta .tp { color: var(--accent); }
  .entry .body { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .entry .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .entry .imgs img { width: 80px; height: 80px; object-fit: cover; border-radius: 7px; border: 1px solid var(--border); }
  .pending-tag { color: var(--journal); }
</style>
</head>
<body>
  <header>
    <span class="brand">2B · capture</span>
    <nav class="links">
      <a href="2b-journal.html">journal →</a>
    </nav>
  </header>

  <div class="compose">
    <textarea id="note" placeholder="What's on your mind?" autofocus></textarea>
    <div class="thumbs" id="thumbs"></div>
    <input id="topic" type="text" placeholder="topic (optional)" autocapitalize="off" autocomplete="off">
    <div class="actions">
      <button class="icon-btn" id="photo-btn" title="Add photo" aria-label="Add photo">📷</button>
      <div class="spacer"></div>
      <button id="save">Save</button>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" capture="environment" multiple hidden>
  <div class="hint">tap 🎙 on your keyboard to dictate · photos open the camera</div>
  <div class="status" id="status"></div>

  <div class="recent-head" id="recent-head" style="display:none">recent</div>
  <div id="recent"></div>

<script>
  const SUPABASE_URL = 'https://wiabftxfumvzbttqgmtq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y0N-mQ5ayjlQPAHqiVisGQ_dDwDB380';
  const BUCKET = 'journal-photos';
  const QUEUE_KEY = '2b-capture-queue';

  const $ = id => document.getElementById(id);
  const noteEl = $('note'), topicEl = $('topic'), thumbsEl = $('thumbs'),
        statusEl = $('status'), recentEl = $('recent'), recentHead = $('recent-head');

  // pending photos selected but not yet saved: { id, file, dataUrl }
  let photos = [];

  // created_at: always a true UTC instant (…Z). created_at is a timestamptz
  // column, so a bare local string would be read as UTC and land hours off.
  function nowStamp() { return new Date().toISOString(); }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  // ── Photo selection ────────────────────────────────────────────────────────
  $('photo-btn').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => {
    for (const file of e.target.files) {
      const id = `${Date.now()}-${Math.round(Math.random()*1e6)}`;
      const reader = new FileReader();
      reader.onload = ev => {
        photos.push({ id, file, dataUrl: ev.target.result });
        renderThumbs();
      };
      reader.readAsDataURL(file);
    }
    e.target.value = '';
  });

  function renderThumbs() {
    thumbsEl.innerHTML = '';
    for (const p of photos) {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.innerHTML = `<img src="${p.dataUrl}"><button aria-label="Remove">×</button>`;
      div.querySelector('button').onclick = () => {
        photos = photos.filter(x => x.id !== p.id);
        renderThumbs();
      };
      thumbsEl.appendChild(div);
    }
  }

  // ── Upload one image, return public URL ────────────────────────────────────
  async function uploadImage(file, dataUrl) {
    // Prefer the live File; fall back to dataUrl (queued offline entries)
    let blob = file, contentType = file && file.type;
    if (!blob && dataUrl) {
      const r = await fetch(dataUrl);
      blob = await r.blob();
      contentType = blob.type;
    }
    const ext = (contentType && contentType.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    const now = new Date();
    const path = `${now.getFullYear()}/${Date.now()}-${Math.round(Math.random()*1e6)}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': contentType || 'image/jpeg',
        'x-upsert': 'true',
      },
      body: blob,
    });
    if (!res.ok) throw new Error(`upload ${res.status}: ${await res.text()}`);
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
  }

  // ── Insert a thought row ───────────────────────────────────────────────────
  async function insertThought({ content, topics, images, created_at }) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/thoughts`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({
        content,
        metadata: { type: 'journal', topics, people: [], action_items: [], images, source: 'capture' },
        created_at,
      }),
    });
    if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
    const [row] = await res.json();
    return row;
  }

  // ── Save flow ──────────────────────────────────────────────────────────────
  async function save() {
    const content = noteEl.value.trim();
    if (!content && photos.length === 0) return;
    const topic = topicEl.value.trim();
    const topics = topic ? [topic] : [];
    const created_at = nowStamp();

    $('save').disabled = true;
    setStatus('saving…');

    // Build the queue-ready payload up front (dataUrls survive a reload)
    const payload = {
      content, topics, created_at,
      photos: photos.map(p => ({ dataUrl: p.dataUrl })),
    };

    try {
      const images = [];
      for (const p of photos) images.push(await uploadImage(p.file, p.dataUrl));
      const row = await insertThought({ content, topics, images, created_at });
      prependEntry(row);
      resetForm();
      setStatus('saved ✓', 'ok');
    } catch (err) {
      // Offline / failed → queue locally and keep going
      enqueue(payload);
      prependEntry({
        content, created_at,
        metadata: { type: 'journal', topics, images: photos.map(p => p.dataUrl) },
        _pending: true,
      });
      resetForm();
      setStatus('saved offline — will sync', 'queued');
    } finally {
      $('save').disabled = false;
      setTimeout(() => { if (statusEl.classList.contains('ok')) setStatus(''); }, 2500);
    }
  }

  function resetForm() {
    noteEl.value = '';
    topicEl.value = '';
    photos = [];
    renderThumbs();
    noteEl.focus();
  }

  $('save').addEventListener('click', save);
  // ⌘/Ctrl+Enter to save from the textarea
  noteEl.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); }
  });

  // ── Offline queue ──────────────────────────────────────────────────────────
  function loadQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch { return []; } }
  function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
  function enqueue(item) { const q = loadQueue(); q.push(item); saveQueue(q); }

  async function flushQueue() {
    let q = loadQueue();
    if (!q.length) return;
    const remaining = [];
    for (const item of q) {
      try {
        const images = [];
        for (const p of (item.photos || [])) images.push(await uploadImage(null, p.dataUrl));
        await insertThought({ content: item.content, topics: item.topics || [], images, created_at: item.created_at });
      } catch {
        remaining.push(item); // still offline — keep for next time
      }
    }
    saveQueue(remaining);
    if (q.length && !remaining.length) {
      setStatus('synced ✓', 'ok');
      loadRecent();
      setTimeout(() => { if (statusEl.classList.contains('ok')) setStatus(''); }, 2500);
    }
  }
  window.addEventListener('online', flushQueue);

  // ── Recent entries ─────────────────────────────────────────────────────────
  function entryHtml(row) {
    const m = row.metadata || {};
    const when = new Date((row.created_at || '').replace(' ', 'T'));
    const whenStr = isNaN(when) ? '' :
      when.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const topic = (m.topics && m.topics[0]) ? `<span class="tp">#${escapeHtml(m.topics[0])}</span>` : '';
    const pending = row._pending ? `<span class="pending-tag">⟳ pending</span>` : '';
    const imgs = (m.images && m.images.length)
      ? `<div class="imgs">${m.images.map(u => `<img src="${u}">`).join('')}</div>` : '';
    return `<div class="meta">${whenStr ? `<span>${whenStr}</span>` : ''}${topic}${pending}</div>
            <div class="body">${escapeHtml(row.content || '')}</div>${imgs}`;
  }
  function prependEntry(row) {
    recentHead.style.display = 'block';
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = entryHtml(row);
    recentEl.prepend(div);
    while (recentEl.children.length > 8) recentEl.lastChild.remove();
  }
  async function loadRecent() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/thoughts?select=id,content,metadata,created_at&order=created_at.desc&limit=8`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) return;
      const rows = await res.json();
      recentEl.innerHTML = '';
      if (rows.length) recentHead.style.display = 'block';
      for (const r of rows) {
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = entryHtml(r);
        recentEl.appendChild(div);
      }
    } catch { /* offline — recent stays empty */ }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadRecent();
  flushQueue();
  noteEl.focus();
</script>
</body>
</html>
